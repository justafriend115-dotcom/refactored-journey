<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#444" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)" opacity="0.3"/>
  
  <!-- Decorative maximalist borders -->
  <rect x="10" y="10" width="1180" height="610" fill="none" stroke="#FFD700" stroke-width="4" rx="20"/>
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#B8860B" stroke-width="2" rx="15" opacity="0.5"/>
  
  <!-- Central Journey Path (Maximalist) -->
  <path d="M 150 450 Q 300 300 450 350 Q 600 400 750 250 Q 900 100 1050 200" 
        fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Glowing Nodes -->
  <circle cx="150" cy="450" r="25" fill="#1a1a1a" stroke="#FFD700" stroke-width="4" filter="url(#glow)"/>
  <circle cx="450" cy="350" r="30" fill="#1a1a1a" stroke="#FFD700" stroke-width="4" filter="url(#glow)"/>
  <circle cx="750" cy="250" r="35" fill="#1a1a1a" stroke="#FFD700" stroke-width="4" filter="url(#glow)"/>
  <circle cx="1050" cy="200" r="25" fill="#1a1a1a" stroke="#FFD700" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Node Icons -->
  <text x="150" y="458" text-anchor="middle" font-size="24" fill="#FFD700">🗺️</text>
  <text x="450" y="358" text-anchor="middle" font-size="24" fill="#FFD700">🌿</text>
  <text x="750" y="258" text-anchor="middle" font-size="24" fill="#FFD700">⚖️</text>
  <text x="1050" y="208" text-anchor="middle" font-size="24" fill="#FFD700">📊</text>
  
  <!-- Main Title -->
  <text x="600" y="120" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="72" fill="url(#goldGrad)" filter="url(#glow)" font-weight="bold">REFACTORED</text>
  <text x="600" y="180" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="72" fill="url(#goldGrad)" filter="url(#glow)" font-weight="bold">JOURNEY</text>
  
  <!-- Tagline -->
  <text x="600" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#CCCCCC" font-style="italic">Navigate the path from legacy to modern</text>
  
  <!-- Feature Labels -->
  <text x="150" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#FFD700" font-weight="bold">Terrain Mapper</text>
  <text x="450" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#FFD700" font-weight="bold">Strangler Fig</text>
  <text x="750" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#FFD700" font-weight="bold">Equivalence Engine</text>
  <text x="1050" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#FFD700" font-weight="bold">Journey Dashboard</text>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.4"/>
  <circle cx="1100" cy="530" r="50" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.4"/>
  <circle cx="200" cy="550" r="20" fill="#FFD700" opacity="0.3"/>
  <circle cx="1000" cy="80" r="15" fill="#FFD700" opacity="0.3"/>
  
  <!-- Bottom accent -->
  <rect x="0" y="600" width="1200" height="30" fill="url(#goldGrad)" opacity="0.2"/>
</svg>
